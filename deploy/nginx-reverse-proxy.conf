# 雪泥 · Thaw —— nginx 反向代理配置范例
#
# 适用场景：前端和后端都作为本地进程运行，nginx 只做反代（不直接托管静态文件）。
#   - 前端（Vite 预览/dev 或任意静态服务）跑在 127.0.0.1:45273
#   - 后端 WebSocket 中转跑在        127.0.0.1:45187
#   - 对外统一用 443 + 域名 your-domain.example
#
# 若你是把构建产物 client/dist 直接交给 nginx 托管（不反代前端），
# 请改用 deploy/nginx.conf（那份用 root + try_files）。
#
# 两条硬约束照旧：
#   1. 前端资源零缓存（no-store）——本地不留 app 文件，尤其 JS。
#   2. 反 SEO / 反爬虫——不给搜索引擎/第三方爬虫可嗅探内容。

# 上游定义（本地进程）
upstream thaw_frontend {
    server 127.0.0.1:45273;
    keepalive 16;
}
upstream thaw_backend {
    server 127.0.0.1:45187;
    keepalive 16;
}

# WebSocket 升级映射（http_upgrade 有值时 Connection: upgrade）
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 443 ssl;
    http2 on;
    server_name your-domain.example;

    # ── TLS（用你自己的证书路径）────────────────────────
    ssl_certificate     /etc/letsencrypt/live/your-domain.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.example/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # 不记录访问日志（URL 路径含 roomId，属最小化元数据）
    access_log off;

    # 传输体上限（富媒体分块虽小，留点余量）
    client_max_body_size 32m;

    # ── 后端 WebSocket 反代：/ws ─────────────────────────
    location /ws {
        proxy_pass http://thaw_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        # 传真实客户端 IP —— 后端按 IP 限流依赖此头（须设 THAW_TRUST_PROXY=1）。
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # WebSocket 长连接：拉长读超时，关闭缓冲
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_buffering off;
        access_log off;
    }

    # ── 前端反代：其余所有路径 ───────────────────────────
    location / {
        proxy_pass http://thaw_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";

        # Vite dev 的 HMR 也走 WebSocket，需支持升级（生产预览可无害保留）
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # 前端资源零缓存（覆盖上游可能带的缓存头）
        proxy_hide_header Cache-Control;
        proxy_hide_header ETag;
        proxy_hide_header Last-Modified;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;

        # 反 SEO / 反爬虫
        add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, noimageindex" always;
        add_header Referrer-Policy "no-referrer" always;

        # 安全响应头
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
    }
}

# HTTP → HTTPS 跳转
server {
    listen 80;
    server_name your-domain.example;
    return 301 https://$host$request_uri;
}
