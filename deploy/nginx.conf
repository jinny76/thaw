# 雪泥 · Thaw —— nginx 部署示例
#
# 两条硬约束（见 docs/ARCHITECTURE.md §7.1）：
#   1. 静态资源零缓存（no-store）——本地不留任何 app 文件，尤其 JS。
#   2. 反 SEO / 反爬虫——不给搜索引擎与第三方爬虫任何可嗅探内容。
# 另：WS /ws 反代到 Node 中转；关闭 access_log（不记录含 roomId 的 URL）。

server {
    listen 443 ssl http2;
    server_name your-domain.example;

    # ssl_certificate     /etc/letsencrypt/live/your-domain.example/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/your-domain.example/privkey.pem;

    # 不记录访问日志（URL 路径含 roomId，属最小化元数据）
    access_log off;

    root /var/www/thaw;          # client/dist 部署到此
    index index.html;

    # ── 静态资源：强制零缓存 ──────────────────────────────
    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;

        # 反爬虫：拒绝索引 / 快照 / 抓取
        add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, noimageindex" always;
        add_header Referrer-Policy "no-referrer" always;

        # 关闭协商缓存，避免 304 复用磁盘副本
        etag off;
        if_modified_since off;

        # 安全响应头
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;

        try_files $uri $uri/ /index.html;
    }

    # ── WebSocket 中转反代 ────────────────────────────────
    location /ws {
        proxy_pass http://127.0.0.1:45187;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        # 传真实客户端 IP —— 后端按 IP 限流依赖此头（须设 THAW_TRUST_PROXY=1）。
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        access_log off;
    }
}

# HTTP → HTTPS 跳转
server {
    listen 80;
    server_name your-domain.example;
    return 301 https://$host$request_uri;
}
