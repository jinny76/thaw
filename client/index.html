<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <!-- 反 SEO / 反爬虫：拒绝一切索引、缓存快照、抓取。不给搜索引擎与第三方爬虫任何可嗅探内容。 -->
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex, nocache" />
    <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet" />
    <meta name="referrer" content="no-referrer" />
    <!-- CSP：禁 inline script、限制来源。connect-src 允许 WSS 与开发用 ws。
         img/media 允许 blob（富媒体经 ObjectURL 渲染）。style 'unsafe-inline' 供构建注入样式。 -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; media-src 'self' blob:; connect-src 'self' ws: wss:; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
    />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>雪泥 · Thaw</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
