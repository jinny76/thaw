<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="0.9" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 暗底圆角方 -->
  <rect x="1" y="1" width="62" height="62" rx="13" fill="#06100c"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="12.5" fill="none" stroke="#0d4a33" stroke-width="1"/>

  <g filter="url(#glow)">
    <!-- 古典聊天窗口：外框（加粗，小尺寸也立得住）-->
    <rect x="10" y="12" width="44" height="34" rx="5" fill="none" stroke="#00ff9c" stroke-width="3.4"/>
    <!-- 标题栏分隔线 -->
    <line x1="10" y1="21" x2="54" y2="21" stroke="#00ff9c" stroke-width="2.6"/>
    <!-- 标题栏三个圆钮 -->
    <circle cx="16.5" cy="16.5" r="2" fill="#00e5ff"/>
    <circle cx="23" cy="16.5" r="2" fill="#ffb020"/>
    <circle cx="29.5" cy="16.5" r="2" fill="#00ff9c"/>

    <!-- 对话气泡（对方，左，青）-->
    <rect x="16" y="27" width="18" height="6" rx="3" fill="#00e5ff"/>
    <!-- 对话气泡（己方，右，绿）-->
    <rect x="30" y="37" width="18" height="6" rx="3" fill="#00ff9c"/>
  </g>

  <!-- 底部"雪化"渐隐点（大尺寸才明显，小尺寸淡出，不干扰）-->
  <g opacity="0.85">
    <circle cx="24" cy="53" r="1.4" fill="#00ff9c"/>
    <circle cx="32" cy="54" r="1.1" fill="#00ff9c" opacity="0.6"/>
    <circle cx="40" cy="53" r="1.4" fill="#00ff9c" opacity="0.75"/>
  </g>
</svg>
